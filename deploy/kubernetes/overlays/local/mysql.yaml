apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels:
    app.kubernetes.io/name: mysql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: auth-service-config
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: auth-service-config
                  key: MYSQL_USER
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: MYSQL_PASSWORD
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - mysqladmin ping -h 127.0.0.1 -u"$MYSQL_USER" -p"$MYSQL_PASSWORD"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - mysqladmin ping -h 127.0.0.1 -u"$MYSQL_USER" -p"$MYSQL_PASSWORD"
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - mysqladmin ping -h 127.0.0.1 -u"$MYSQL_USER" -p"$MYSQL_PASSWORD"
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    app.kubernetes.io/name: mysql
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      protocol: TCP
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-bootstrap
  labels:
    app.kubernetes.io/name: mysql-bootstrap
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mysql-bootstrap
          image: mysql:8.4
          command:
            - /bin/sh
            - -ec
            - |
              for identifier in "$MYSQL_USER" "$PRODUCT_DATABASE" "$ORDER_DATABASE"; do
                case "$identifier" in
                  ""|*[!a-zA-Z0-9_]*)
                    echo "MySQL identifiers may only contain letters, numbers and underscores" >&2
                    exit 1
                    ;;
                esac
              done
              until MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP \
                -h "$DATABASE_HOST" -P "$DATABASE_PORT" -u root -e 'SELECT 1' >/dev/null 2>&1; do
                echo "waiting for mysql"
                sleep 2
              done
              MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP \
                -h "$DATABASE_HOST" -P "$DATABASE_PORT" -u root <<SQL
              CREATE DATABASE IF NOT EXISTS \`$PRODUCT_DATABASE\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              CREATE DATABASE IF NOT EXISTS \`$ORDER_DATABASE\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, INDEX, REFERENCES ON \`$PRODUCT_DATABASE\`.* TO '$MYSQL_USER'@'%';
              GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, INDEX, REFERENCES ON \`$ORDER_DATABASE\`.* TO '$MYSQL_USER'@'%';
              SQL
          env:
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  name: auth-service-config
                  key: DATABASE_HOST
            - name: DATABASE_PORT
              valueFrom:
                configMapKeyRef:
                  name: auth-service-config
                  key: DATABASE_PORT
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: auth-service-config
                  key: MYSQL_USER
            - name: PRODUCT_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: product-service-config
                  key: MYSQL_DATABASE
            - name: ORDER_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: order-service-config
                  key: MYSQL_DATABASE
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-service-secrets
                  key: MYSQL_ROOT_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
