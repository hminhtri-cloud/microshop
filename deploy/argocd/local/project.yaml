apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: microshop-local
  namespace: argocd
spec:
  description: Local Minikube project for the MicroShop GitOps demo.
  sourceRepos:
    - https://github.com/hminhtri-cloud/microshop.git
  destinations:
    - namespace: microshop
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
