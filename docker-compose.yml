services:
  mysql:
    image: mysql:8.4
    container_name: microshop-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}

    ports:
      - "127.0.0.1:3307:3306"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" -D "$$MYSQL_DATABASE" -e ''SELECT 1'' >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - microshop-network

  auth-service:
    build:
      context: ./services/auth-service

    container_name: microshop-auth
    restart: unless-stopped
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-30}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    ports:
      - "127.0.0.1:8001:8000"

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - microshop-network

  product-db-setup:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
    entrypoint: ["/bin/sh", "/init-product-db.sh"]
    volumes:
      - ./services/product-service/init-product-db.sh:/init-product-db.sh:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - microshop-network

  product-service:
    build: ./services/product-service
    restart: unless-stopped
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      MYSQL_DATABASE: product_db
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      AUTH_SERVICE_URL: http://auth-service:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      product-db-setup:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - microshop-network

  order-db-setup:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
    entrypoint: ["/bin/sh", "/init-order-db.sh"]
    volumes:
      - ./services/order-service/init-order-db.sh:/init-order-db.sh:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - microshop-network

  order-service:
    build: ./services/order-service
    restart: unless-stopped
    environment:
      DATABASE_HOST: mysql
      DATABASE_PORT: "3306"
      MYSQL_DATABASE: order_db
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      AUTH_SERVICE_URL: http://auth-service:8000
      PRODUCT_SERVICE_URL: http://product-service:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
    ports:
      - "127.0.0.1:8004:8000"
    depends_on:
      order-db-setup:
        condition: service_completed_successfully
      product-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - microshop-network

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:80"

    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - microshop-network

volumes:
  mysql_data:

networks:
  microshop-network:
    driver: bridge
