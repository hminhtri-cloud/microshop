server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Endpoint nội bộ không được truy cập qua website.
    location ^~ /api/internal {
        return 404;
    }

    # Các API sản phẩm.
    location ~ ^/api/(products|seller/products|admin/products)(/|$) {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://product-service:8000;
    }

    # Các API đơn hàng.
    location ~ ^/api/(orders|seller/orders|admin/orders)(/|$) {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://order-service:8000;
    }

    # Các API còn lại, như đăng nhập và hồ sơ seller.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://auth-service:8000;
    }

    location = /api {
        return 404;
    }

    # File JavaScript/CSS không tồn tại thì trả 404.
    location /assets/ {
        try_files $uri =404;
    }

    # Các trang React, kể cả khi người dùng refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}