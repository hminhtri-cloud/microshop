# This workflow runs the MicroShop CI pipeline, which includes unit tests, integration tests, and end-to-end tests for the microservices and frontend.
# Created by Tri
name: MicroShop CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: microshop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Ephemeral test credentials only; never point CI at the local/cloud DB.
      MYSQL_ROOT_PASSWORD: ci-only-root-password
      MYSQL_DATABASE: auth_db
      MYSQL_USER: microshop
      MYSQL_PASSWORD: ci-only-app-password
      JWT_SECRET: ci-only-long-jwt-signing-key-keep-private-in-real-environments
      JWT_EXPIRE_MINUTES: "30"
      INTERNAL_SERVICE_TOKEN: ci-only-internal-service-token

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Compose configuration
        run: make compose-check

      - name: Build and start local services
        run: make up

      - name: Test backend
        run: make test-backend

      - name: Create disposable MySQL concurrency databases
        run: |
          docker compose exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" exec mysql -u root' <<'SQL'
          CREATE DATABASE inventory_test;
          CREATE DATABASE order_test;
          GRANT ALL ON inventory_test.* TO 'microshop'@'%';
          GRANT ALL ON order_test.* TO 'microshop'@'%';
          SQL

      - name: Test inventory concurrency on MySQL
        run: |
          docker compose run --rm --no-deps -e DATABASE_URL=sqlite:// \
            -e INVENTORY_TEST_DATABASE_URL=mysql+pymysql://microshop:ci-only-app-password@mysql/inventory_test \
            -v "$PWD/services/product-service/tests:/tests:ro" \
            product-service python -m unittest discover -s /tests -p test_inventory.py -v

      - name: Test checkout idempotency and payment races on MySQL
        run: |
          docker compose run --rm --no-deps -e DATABASE_URL=sqlite:// \
            -e ORDER_TEST_DATABASE_URL=mysql+pymysql://microshop:ci-only-app-password@mysql/order_test \
            -v "$PWD/services/order-service/tests:/tests:ro" \
            order-service python -m unittest discover -s /tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        run: make lint-frontend

      - name: Typecheck and build frontend
        run: make build-frontend

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Test browser flows and local API proxy
        run: make test-e2e

      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Show service state on failure
        if: failure()
        run: docker compose ps

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
